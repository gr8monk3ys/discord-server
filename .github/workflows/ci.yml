# Lint and both Python test suites, and the site's lint, types, tests and build, on every pull request
# and every push to main.
# No path filters on purpose: the job always reports, so "Lint and tests" can be a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            bot/requirements.txt

      # Pillow's wheels bundle Raqm and HarfBuzz but load FriBiDi from the system. The card tests
      # pass without it (bot/logic/cards.py falls back to basic layout); installing it makes CI
      # exercise the same text-shaping path as the Docker image.
      - name: Install FriBiDi
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Bot tests
        working-directory: bot
        run: python -m pytest -q -p no:warnings

      - name: Server tests
        working-directory: server
        run: python -m pytest -q tests

  site:
    # The landing page (site/): a Next.js app built with bun, as on Vercel. Lint, types, the
    # Vitest suite (route handlers, page markup, live-data checks) and a production build. No
    # secrets: the routes that need them answer "not set up yet" without them.
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Knip (dead code / unused deps)
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Tests with coverage thresholds
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # Includes e2e/a11y.spec.ts: axe-core on every template, light and dark.
      - name: End-to-end tests
        timeout-minutes: 10
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e

  site-lighthouse:
    # Lighthouse score floors and the home document byte cap, against a production build, as on
    # lscaturchio.xyz. Floors and the cap live in site/scripts/check-lighthouse-score.mjs.
    name: Site Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [site]
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Start
        run: |
          bun run start -- --hostname 127.0.0.1 --port 3000 > /tmp/site.log 2>&1 &
          echo $! > /tmp/site.pid
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/site.log
          exit 1

      - name: Enforce Lighthouse score floors
        run: bun run lighthouse:ci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: site/artifacts/lighthouse
          retention-days: 7

      - name: Stop
        if: always()
        run: |
          if [ -f /tmp/site.pid ]; then kill "$(cat /tmp/site.pid)" || true; fi
