# Lint and both test suites, on every pull request and every push to main.
# No path filters on purpose: the job always reports, so "Lint and tests" can be a required check.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; runs on main all finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            bot/requirements.txt

      # Pillow's wheels bundle Raqm and HarfBuzz but load FriBiDi from the system. The card tests
      # pass without it (bot/logic/cards.py falls back to basic layout); installing it makes CI
      # exercise the same text-shaping path as the Docker image.
      - name: Install FriBiDi
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfribidi0

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Bot tests
        working-directory: bot
        run: python -m pytest -q -p no:warnings

      - name: Server tests
        working-directory: server
        run: python -m pytest -q tests
