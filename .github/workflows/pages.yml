# Deploys site/ (the landing page) to GitHub Pages, the mirror of https://discord.lscaturchio.xyz/
# (Vercel serves the canonical copy straight from site/, see site/README.md).
# One-time setup: Settings > Pages > Source: "GitHub Actions" (or the gh command in site/README.md).
name: Deploy landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 404.html uses root-absolute paths ("/style.css") so it works at any depth on
      # Vercel; the Pages mirror lives under /<repo>/, so prefix them there.
      - name: Prefix 404.html paths for the project site
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i -E "s#(href|src)=\"/#\1=\"${base}#g" site/404.html
          grep -c "${base}" site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
