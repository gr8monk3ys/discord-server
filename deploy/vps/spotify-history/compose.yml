# SpotifyForge's one-shots beside the bot. The hourly listening log (front-desk-spotify-history.timer)
# and the Monday playlist maintenance (front-desk-spotify-weekly.timer) share one Spotify grant, so
# they must never overlap. Both timers take /run/lock/spotifyforge.lock; by hand, take it too:
#
#   flock /run/lock/spotifyforge.lock docker compose run --rm -T history     one sync, from this folder
#   flock /run/lock/spotifyforge.lock docker compose run --rm -T weekly      one maintenance run (writes to Spotify)
#   docker compose build                                                     after changing the Dockerfile's pinned commit
#
# The bot sees only /srv/spotifyforge/data, read-only (docker-compose.yml at the repo root), so nothing
# secret goes in there. The Spotify login is in login/ (the job's user only) and client.env (root
# only): see docs/HOSTING.md.
name: spotify-history

services:
  history: &job
    build: .
    image: spotify-history
    env_file:
      - path: /srv/spotifyforge/client.env
        required: false              # `docker compose build` runs before the secrets are copied
    volumes:
      - /srv/spotifyforge/data:/data
      - /srv/spotifyforge/login:/login
    network_mode: bridge             # no network of its own for a one-shot
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  weekly:
    <<: *job
    command: ["sh", "/weekly.sh"]
    mem_limit: 1g                    # plans the whole catalogue from every liked song
